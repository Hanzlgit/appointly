services:
  mysql:
    image: mysql:8.4.5
    container_name: appointly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appointly
      MYSQL_USER: appointly
      MYSQL_PASSWORD: appointly
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uappointly", "-pappointly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4.2-alpine
    container_name: appointly-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0.9-management-alpine
    container_name: appointly-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: appointly
      RABBITMQ_DEFAULT_PASS: appointly
    ports:
      - "25672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
